# Every test shares one JVM and one client address: the production limits would throttle the suite. RateLimitApiTest sets its own tiny ones.
glassbox.rate.principal-per-minute=100000
glassbox.rate.workspace-per-minute=100000
glassbox.rate.auth-per-minute=100000
glassbox.rate.public-per-minute=100000
glassbox.rate.anonymous-per-minute=100000
glassbox.limits.max-active-runs=1000
# small pools: each test context holds its own for the whole run
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1
