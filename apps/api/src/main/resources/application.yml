spring:
  application:
    name: glassbox
  datasource:
    # Runtime connection: glassbox_app (not the table owner, no BYPASSRLS).
    url: ${GLASSBOX_DB_URL:jdbc:postgresql://localhost:5432/glassbox}
    username: ${GLASSBOX_APP_USER:glassbox_app}
    password: ${GLASSBOX_APP_PASSWORD:}
  flyway:
    enabled: false          # only the api profile migrates
    locations: classpath:db/migrations
    # Migrations run as the table owner, never as the runtime role.
    url: ${GLASSBOX_DB_URL:jdbc:postgresql://localhost:5432/glassbox}
    user: ${GLASSBOX_OWNER_USER:glassbox_owner}
    password: ${GLASSBOX_OWNER_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  jackson:
    default-property-inclusion: non_null

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true   # the dashboard's request latency panel needs the buckets
  tracing:
    sampling:
      probability: 1.0   # every request gets a trace id for the logs; nothing is exported until an OTLP endpoint is configured
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

glassbox:
  jwt:
    secret: ${GLASSBOX_JWT_SECRET:}
    access-ttl: 15m
  refresh:
    ttl: 14d
    secure-cookie: ${GLASSBOX_COOKIE_SECURE:false}
  storage:
    dir: ${GLASSBOX_STORAGE_DIR:./data/files}
  limits:
    max-documents: 50
    # experiments and AutoTune searches of one workspace that may be queued or running at once
    max-active-runs: 3
    max-file-bytes: 26214400
  llm:
    # Any OpenAI-compatible chat endpoint: Ollama (default), Groq, OpenRouter, Gemini's compatible API, vLLM.
    base-url: ${GLASSBOX_LLM_BASE_URL:http://localhost:11434}
    model: ${GLASSBOX_LLM_MODEL:llama3.2:3b}
    api-key: ${GLASSBOX_LLM_API_KEY:}
    temperature: 0.0
    max-tokens: 400
    max-attempts: 3
    backoff: 500ms
    read-timeout: 180s
    # Protects a small free server: one generation at a time, a short wait, then HTTP 429.
    max-concurrent: 1
    queue-wait: 2s
    rate-per-minute: 20
  rate:
    # Requests per minute per caller (token bucket; the burst is the same number). Chat has its own, tighter limit above.
    principal-per-minute: 600     # one signed-in user or one API key
    workspace-per-minute: 1200    # all API keys of one workspace together
    auth-per-minute: 20           # sign-in, sign-up and refresh, per client address
    public-per-minute: 60         # public report links, per client address
    anonymous-per-minute: 120     # requests without a valid credential, per client address
  traces:
    retention-days: 30
  eval:
    # Sampling seed for answer generation and judging; temperature is always 0. Stored with every run.
    seed: 42
  cost:
    # Prices in USD per million tokens. A local model costs nothing, so the default is zero; set these for a hosted model.
    prompt-usd-per-million: ${GLASSBOX_COST_PROMPT:0.0}
    completion-usd-per-million: ${GLASSBOX_COST_COMPLETION:0.0}
  testset:
    # Two extra model calls per question (self-contained? answerable from the evidence alone?). Off = faster, fewer flags.
    llm-filters: ${GLASSBOX_TESTSET_LLM_FILTERS:true}
  chat:
    reranker: NONE
    top-n: 5
    # In this project's token units (see TokenIndex), which run below a real tokenizer's count.
    # 2000 keeps a prompt inside a 4096-token context window with room for the answer.
    token-budget: 2000
  embed:
    default-model: bge-small-en-v1.5
    max-attempts: 4
    backoff: 500ms
    batch-size: 64
    sidecar:
      enabled: true
      url: ${GLASSBOX_SIDECAR_URL:http://localhost:8000}
    openai:
      api-key: ${GLASSBOX_OPENAI_API_KEY:}
      base-url: ${GLASSBOX_OPENAI_BASE_URL:https://api.openai.com}
  ingest:
    chunk-size: 512
    parse-timeout: 60s
  worker:
    concurrency: 2
  cors:
    allowed-origins: ${GLASSBOX_CORS_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    path: /api/docs/openapi
  swagger-ui:
    enabled: false
