# Scrapes the API and the worker. Start with: docker compose --profile observability up
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: glassbox-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
  - job_name: glassbox-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["worker:8081"]
