# Glassbox self-host stack. Run from the repo root:
#   cp .env.example .env && docker compose -f deploy/docker-compose.yml --env-file .env up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-glassbox}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      GLASSBOX_OWNER_PASSWORD: ${GLASSBOX_OWNER_PASSWORD:?set in .env}
      GLASSBOX_APP_PASSWORD: ${GLASSBOX_APP_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-glassbox}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment: &app-env
      GLASSBOX_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-glassbox}
      GLASSBOX_APP_PASSWORD: ${GLASSBOX_APP_PASSWORD:?set in .env}
      GLASSBOX_OWNER_PASSWORD: ${GLASSBOX_OWNER_PASSWORD:?set in .env}
      GLASSBOX_JWT_SECRET: ${GLASSBOX_JWT_SECRET:?set in .env}
      GLASSBOX_CORS_ORIGINS: http://localhost:8080
      GLASSBOX_SIDECAR_URL: http://ml-sidecar:8000
      # Any OpenAI-compatible endpoint. Default: Ollama running on the host machine.
      GLASSBOX_LLM_BASE_URL: ${GLASSBOX_LLM_BASE_URL:-http://host.docker.internal:11434}
      GLASSBOX_LLM_MODEL: ${GLASSBOX_LLM_MODEL:-llama3.2:3b}
      GLASSBOX_LLM_API_KEY: ${GLASSBOX_LLM_API_KEY:-}
      SPRING_PROFILES_ACTIVE: api
      GLASSBOX_STORAGE_DIR: /data/files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"

  ml-sidecar:
    build:
      context: ../apps/ml-sidecar
    # Embeddings and reranking; models are baked into the image. Healthcheck is defined in the Dockerfile.

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: worker
      SERVER_PORT: "8081"
    volumes:
      - files:/data/files
    depends_on:
      api:
        condition: service_healthy
      ml-sidecar:
        condition: service_healthy

  # Optional self-contained LLM: docker compose --profile ollama up, then
  #   docker compose exec ollama ollama pull llama3.2:3b
  # and set GLASSBOX_LLM_BASE_URL=http://ollama:11434 in .env.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama:/root/.ollama

  web:
    build:
      context: ../apps/web
    depends_on:
      - api
    ports:
      - "8080:8080"

volumes:
  pgdata:
  files:
  ollama:
