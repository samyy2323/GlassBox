# Runs as an unprivileged user: every path it writes is under /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/nx-body; proxy_temp_path /tmp/nx-proxy; fastcgi_temp_path /tmp/nx-fcgi; uwsgi_temp_path /tmp/nx-uwsgi; scgi_temp_path /tmp/nx-scgi;
  client_max_body_size 30m;
  server {
    listen 7860;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz { default_type text/plain; return 200 "ok"; }

    location /api/ {
      proxy_pass http://127.0.0.1:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      # Browsers send their own origin on same-origin POSTs; the API's allow-list names one fixed origin, so present that one (the site is served from a single origin).
      proxy_set_header Origin http://localhost:7860;
      proxy_buffering off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 300s;
    }

    location / { try_files $uri /index.html; }
  }
}
